<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="style.css" />
    <title>Event-Driven Programming</title>
  </head>
  <body
    class="m-auto flex flex-row items-center justify-center min-h-screen gap-10"
  >
    <form
      id="signupForm"
      class="w-[30vw] h-[430px] bg-white shadow-lg border-1 border-slate-500 flex flex-col items-center justify-center gap-3"
    >
      <p class="text-2xl mb-5 mt-5 text-slate-500 font-bold">User Sign-up</p>
      <!-- email address -->
      <div class="flex flex-col gap-2">
        <p>Email Address</p>
        <input
          type="email"
          name="email"
          class="w-full h-[35px] bg-white border-1 border-slate-800 rounded-lg"
          id="userEmail"
          <!-- onchange="" -->
        />
        <span id="emailError" class="text-red-600 text-sm italic"></span>
      </div>

      <!-- phone number -->
      <div class="flex flex-col gap-2">
        <p>Phone Number</p>
        <input
          type="text"
          maxlength="11"
          name="phoneNumber"
          id="userPhone"
          class="w-full h-[35px] bg-white border-1 border-slate-800 rounded-lg"
        />
        <span id="phoneError" class="text-red-600 text-sm italic"></span>
      </div>

      <!-- password -->
      <div class="flex flex-col gap-2">
        <p>Password</p>
        <input
          name="password"
          type="password"
          id="userPassword"
          class="w-full h-[35px] bg-white border-1 border-slate-800 rounded-lg"
        />
        <span id="passwordError" class="text-red-600 text-sm italic"></span>
      </div>

      <!-- submit button (triggers validation) -->
      <button
        type="submit"
        class="w-fit h-[35px] bg-slate-800 text-white rounded-lg px-5 mt-5 mb-5"
      >
        Sign Up
      </button>
    </form>
    
    <script src="example.js"></script>
  </body>
</html>
